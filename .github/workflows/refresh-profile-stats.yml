name: Refresh public profile statistics

on:
  schedule:
    - cron: '23 15 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update-stats.mjs
      - .github/workflows/refresh-profile-stats.yml

permissions:
  contents: write

concurrency:
  group: public-profile-statistics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Read public GitHub metadata and render card
        run: node scripts/update-stats.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit changed graphics only
        run: |
          git add assets/github-snapshot.svg assets/public-github-snapshot.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh public profile statistics [skip ci]'
          git push
